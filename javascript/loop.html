<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="demo"></p>
    <script>
      var fruits = ["Banana", "Orange", "Apple"];
      for (var i = 0; i < fruits.length; i++) {
        if (i == 1) continue;
        document.getElementById("demo").innerHTML += fruits[i] + "<br>";
      }
    </script>
  </body>
</html>
