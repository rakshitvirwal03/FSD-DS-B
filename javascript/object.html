<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="demo"></p>
    <script>
      const student = {
        name: "rakshit",
        class: "ds-b",
        fee: "5000",
      };
      for (let key in student) {
        document.getElementById("demo").innerHTML += student[key] + "<br>";
      }
    </script>
  </body>
</html>
